[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifa-business-layer"
version = "0.1.0"
description = "Business-layer focus objects for iFA"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ifa_business_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
